name: ci

on:
  push:
    branches: [main, master, 'ci/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-26]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Check CLI and harness syntax
        run: |
          node --check scripts/ctx.mjs
          node --check tests/run.mjs
      - name: Self-test the ctx CLI
        run: node tests/run.mjs
      - name: Verify symlink injection through an aliased temporary root
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          mkdir "$work/real"
          ln -s "$work/real" "$work/alias"
          TMPDIR="$work/alias" node tests/run.mjs symlinks

  self-context:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Configure the checked-out native link transport
        run: git config --local core.symlinks true
      - name: Lint this repository's actual context
        run: node context/ctx.mjs lint --strict
      - name: Detect stale context in full git history
        run: node context/ctx.mjs stale --strict
      - name: Verify actual repository wiring
        run: node context/ctx.mjs doctor
      - name: Check both version tracks and their documented mapping
        run: node tests/check-versions.mjs
      - name: Prove baseline gates reject injected drift
        run: node tests/check-baseline.mjs

  # A scaffold has intentional placeholders, never structural errors.
  scaffold-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Scaffold into a scratch project and verify it
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          mkdir -p "$work/src"
          echo 'export const x = 1;' > "$work/src/index.ts"
          git -C "$work" init -q
          git -C "$work" config user.email ci@example.com
          git -C "$work" config user.name CI
          node scripts/ctx.mjs init --root "$work" --ui --full --pointers
          cd "$work"
          node context/ctx.mjs index
          node context/ctx.mjs lint --json > lint.json || true
          node -e "
            const r = JSON.parse(require('fs').readFileSync('lint.json', 'utf8'));
            const fatal = r.errors.filter((e) => !/unfilled/.test(e));
            if (fatal.length) { console.error('unexpected scaffold errors:', fatal); process.exit(1); }
            console.log('scaffold lints clean:', r.pages, 'pages');
          "
          node context/ctx.mjs doctor
          node context/ctx.mjs status

  release-consistency:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify the actual published tag and both version tracks
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node tests/check-versions.mjs --require-tag --tag="$RELEASE_TAG"
