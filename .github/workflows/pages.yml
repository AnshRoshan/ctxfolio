# Target path in your repo: .github/workflows/pages.yml
#
# Replaces the previous static-upload workflow. The site is now a Vite project
# that lives in web/, so Pages must build it before it deploys.
#
# The build output is ONE self-contained index.html (vite-plugin-singlefile
# inlines the CSS and the JS). No asset URLs are emitted, so the site works at
# any path. You do not need to set a Vite `base` for the
# /project-context-system/ subpath.

name: pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build the site
        run: npm run build

      - name: Verify the build produced a single file
        run: |
          test -f dist/index.html
          echo "dist/index.html: $(wc -c < dist/index.html) bytes"
          # the build must not emit external assets; singlefile inlines them
          if [ -d dist/assets ] && [ -n "$(ls -A dist/assets 2>/dev/null)" ]; then
            echo "warning: dist/assets is not empty. The site may need a Vite base path."
          fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
